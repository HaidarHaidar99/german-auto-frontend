<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="König Automobile Rheinberg — Ihr exklusiver Partner für Premium- und Luxusautomobile" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>König Automobile Rheinberg</title>
  </head>
  <body style="background-color: #0c0d10; color: #ffffff; margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant Brand Loading Experience -->
      <div id="app-initial-loader" style="position: fixed; inset: 0; background-color: #0c0d10; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: 'Manrope', system-ui, -apple-system, sans-serif;">
        <div style="font-size: clamp(20px, 4vw, 26px); font-weight: 800; letter-spacing: -0.4px; color: #ffffff; text-align: center; padding: 0 16px;">
          König Automobile Rheinberg
        </div>
        <img src="https://ylmahjqspbudmtewjhcg.supabase.co/storage/v1/object/public/german-auto-media/site/branding/1790760237272-so6ety.jpg" alt="König Automobile Rheinberg" style="width: 140px; max-width: 75vw; height: auto; object-fit: contain; filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.6));" onerror="this.style.display='none'" />
        <div style="width: 180px; height: 3px; background: rgba(255, 255, 255, 0.12); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, #D4AF37, #F5D77F); border-radius: 9999px; animation: initialLoaderProgress 1.4s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes initialLoaderProgress {
            0% { left: -40%; width: 30%; }
            50% { left: 35%; width: 55%; }
            100% { left: 100%; width: 30%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
