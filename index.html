<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="König Automobile Rheinberg — Ihr exklusiver Partner für Premium- und Luxusautomobile" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=DM+Serif+Display&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>König Automobile Rheinberg</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('site_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: var(--color-background); color: var(--color-text); margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
